<!DOCTYPE html>
<html lang="my" translate="no">
<head>
<meta charset="UTF-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ဂဏန်းတွက်စက်</title>
<meta name="theme-color" content="#2f3b35">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<style>
  :root {
    color-scheme: light;
    --page: #dce3da; --body: #2f3b35; --onbody: #e9eee6;
    --lcd: #c9d6b8; --ink: #1f2a1e;
    --num: #f2f0e6; --numink: #1f2a1e;
    --fn: #9fb0a3; --fnink: #1f2a1e;
    --op: #3e6b5a; --opink: #fff; --eq: #e3b23c;
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page: #0f1411; --body: #1a221e; --onbody: #dfe6dc;
    --lcd: #a9b89b; --ink: #1a2417;
    --num: #35433b; --numink: #eef1e8;
    --fn: #55675b; --fnink: #eef1e8;
    --op: #3e6b5a; --eq: #d9a62e;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  body {
    margin: 0; min-height: 100vh; min-height: 100dvh; padding: 10px; display: grid; place-items: center;
    background: var(--page); font-family: system-ui, "Noto Sans Myanmar", sans-serif;
  }
  .calc {
    width: min(100%, 560px); height: min(calc(100vh - 20px), 900px); height: min(calc(100dvh - 20px), 900px);
    padding: clamp(12px, 3vw, 20px); border-radius: 22px;
    display: flex; flex-direction: column;
    background: var(--body); box-shadow: 0 14px 30px rgba(0,0,0,.28);
  }
  .bar { display: flex; gap: 8px; margin-bottom: 10px; }
  .chip {
    border: 0; border-radius: 999px; padding: 7px 14px; font-size: .95rem;
    background: rgba(255,255,255,.12); color: var(--onbody); cursor: pointer;
  }
  .chip:focus-visible, .keys button:focus-visible, .item:focus-visible { outline: 3px solid var(--eq); outline-offset: 2px; }
  .spacer { flex: 1; }
  .lcd {
    background: var(--lcd); color: var(--ink); border-radius: 10px;
    padding: 10px 14px; margin-bottom: 12px; text-align: right;
    box-shadow: inset 0 2px 6px rgba(0,0,0,.25); min-height: clamp(92px, 15vh, 170px);
    display: flex; flex-direction: column; justify-content: space-between;
  }
  #expr { font-size: .95rem; min-height: 1.2em; opacity: .7; overflow: hidden; white-space: nowrap; }
  #out  { font-size: 2.6rem; line-height: 1.15; font-weight: 600; overflow: hidden; white-space: nowrap; }
  .stage { position: relative; flex: 1; min-height: 0; }
  .keys { display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(6, 1fr); gap: clamp(8px, 2vw, 14px); height: 100%; }
  .keys button {
    border: 0; border-radius: 12px; min-height: 0; font-size: clamp(1.25rem, 4.8vw, 2rem); font-weight: 600;
    background: var(--num); color: var(--numink); cursor: pointer;
    box-shadow: 0 3px 0 rgba(0,0,0,.3);
    transition: transform .06s, box-shadow .06s;
  }
  .keys button:active { transform: translateY(3px); box-shadow: 0 0 0 rgba(0,0,0,.3); }
  .keys .fn { background: var(--fn); color: var(--fnink); }
  .keys .op { background: var(--op); color: var(--opink); }
  .keys .eq { background: var(--eq); color: #1f2a1e; }
  .keys .zero { grid-column: span 2; }

  .hist {
    position: absolute; inset: 0; z-index: 2; background: var(--body);
    display: flex; flex-direction: column; color: var(--onbody);
  }
  .hist-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .hist-head h2 { margin: 0; font-size: 1.05rem; flex: 1; }
  .list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding-right: 2px; }
  .item {
    border: 0; border-radius: 10px; padding: 8px 12px; text-align: right; cursor: pointer;
    background: var(--lcd); color: var(--ink); display: flex; flex-direction: column; gap: 2px;
  }
  .item span { font-size: .85rem; opacity: .7; }
  .item strong { font-size: 1.3rem; }
  .empty { margin: auto; text-align: center; opacity: .8; line-height: 1.7; padding: 0 12px; }
  @media (max-aspect-ratio: 4/5) {
    body { padding: 0; }
    .calc { width: 100%; height: 100vh; height: 100dvh; border-radius: 0; box-shadow: none; }
  }
  @media (prefers-reduced-motion: reduce) { .keys button { transition: none; } }
</style>
</head>
<body>
  <main class="calc">
    <div class="bar">
      <button class="chip" id="histBtn" type="button">မှတ်တမ်း</button>
      <span class="spacer"></span>
      <button class="chip" id="digitBtn" type="button" aria-label="မြန်မာဂဏန်း ပြောင်းရန်"></button>
      <button class="chip" id="themeBtn" type="button" aria-label="အလင်း/အမှောင် ပြောင်းရန်"></button>
    </div>

    <div class="lcd" aria-live="polite">
      <div id="expr"></div>
      <div id="out">0</div>
    </div>

    <div class="stage">
      <div class="keys" id="keys">
        <button class="fn" data-k="sqrt">√</button>
        <button class="fn" data-k="sq">x²</button>
        <button class="fn" data-k="pi">π</button>
        <button class="fn" data-k="del">⌫</button>

        <button class="fn" data-k="C">C</button>
        <button class="fn" data-k="neg">±</button>
        <button class="fn" data-k="%">%</button>
        <button class="op" data-k="/">÷</button>

        <button data-k="7">7</button>
        <button data-k="8">8</button>
        <button data-k="9">9</button>
        <button class="op" data-k="*">×</button>

        <button data-k="4">4</button>
        <button data-k="5">5</button>
        <button data-k="6">6</button>
        <button class="op" data-k="-">−</button>

        <button data-k="1">1</button>
        <button data-k="2">2</button>
        <button data-k="3">3</button>
        <button class="op" data-k="+">+</button>

        <button class="zero" data-k="0">0</button>
        <button data-k=".">.</button>
        <button class="eq" data-k="=">=</button>
      </div>

      <section class="hist" id="hist" hidden>
        <div class="hist-head">
          <h2>မှတ်တမ်း</h2>
          <button class="chip" id="clearBtn" type="button">အားလုံးဖျက်</button>
          <button class="chip" id="closeBtn" type="button">ပိတ်</button>
        </div>
        <div class="list" id="list"></div>
      </section>
    </div>
  </main>

<script>
  const $ = id => document.getElementById(id);
  const out = $('out'), ex = $('expr'), hist = $('hist'), list = $('list');
  const sym = { '+': '+', '-': '−', '*': '×', '/': '÷' };
  const MM = '၀၁၂၃၄၅၆၇၈၉';

  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  };

  let cur = '0', prev = null, op = null, fresh = false, justOp = false, expr = '';
  let myan = store.get('calc-myan') === '1';
  let history = [];
  try { history = JSON.parse(store.get('calc-history') || '[]'); } catch (e) { history = []; }

  const show = s => myan ? String(s).replace(/\d/g, d => MM[d]) : String(s);
  const fmt = n => isFinite(n) ? String(parseFloat(Number(n).toPrecision(12))) : 'Error';

  function calc(a, b, o) {
    a = +a; b = +b;
    if (o === '+') return a + b;
    if (o === '-') return a - b;
    if (o === '*') return a * b;
    return b === 0 ? NaN : a / b;
  }

  function addHistory(e, r) {
    history.unshift({ e, r });
    history = history.slice(0, 30);
    store.set('calc-history', JSON.stringify(history));
  }

  function reset() { cur = '0'; prev = null; op = null; fresh = false; justOp = false; expr = ''; }

  function press(k) {
    if (cur === 'Error') reset();

    if (/^\d$/.test(k)) {
      if (fresh || cur === '0') { cur = k; fresh = false; }
      else if (cur.replace(/[-.]/g, '').length < 12) cur += k;
      justOp = false;
    } else if (k === '.') {
      if (fresh) { cur = '0.'; fresh = false; }
      else if (!cur.includes('.')) cur += '.';
      justOp = false;
    } else if (k in sym) {
      if (op && !justOp) {
        prev = fmt(calc(prev, cur, op));
        if (prev === 'Error') { cur = 'Error'; op = null; render(); return; }
      } else if (!op) {
        prev = cur;
      }
      op = k; justOp = true; fresh = true; cur = prev;
      expr = prev + ' ' + sym[k];
    } else if (k === '=') {
      if (op !== null) {
        const e = prev + ' ' + sym[op] + ' ' + cur;
        const res = fmt(calc(prev, cur, op));
        expr = e + ' ='; cur = res; op = null; justOp = false; fresh = true;
        if (res !== 'Error') addHistory(e, res);
      }
    } else if (k === 'sqrt' || k === 'sq') {
      const x = +cur;
      const e = k === 'sqrt' ? '√(' + cur + ')' : '(' + cur + ')²';
      const res = fmt(k === 'sqrt' ? (x < 0 ? NaN : Math.sqrt(x)) : x * x);
      expr = e + ' ='; cur = res; fresh = true; justOp = false;
      if (res !== 'Error') addHistory(e, res);
    } else if (k === 'pi') {
      cur = fmt(Math.PI); fresh = true; justOp = false;
    } else if (k === 'C') {
      reset();
    } else if (k === 'del') {
      if (fresh || cur.length <= 1 || (cur.length === 2 && cur[0] === '-')) cur = '0';
      else cur = cur.slice(0, -1);
    } else if (k === '%') {
      cur = fmt(+cur / 100); fresh = true;
    } else if (k === 'neg') {
      if (cur !== '0') cur = cur[0] === '-' ? cur.slice(1) : '-' + cur;
    }
    render();
  }

  const digitKeys = [...document.querySelectorAll('.keys [data-k]')].filter(b => /^\d$/.test(b.dataset.k));

  function render() {
    const t = show(cur);
    out.textContent = t;
    ex.textContent = show(expr);
    out.style.fontSize = t.length > 10 ? 'clamp(1.7rem, 6.5vw, 2.6rem)' : t.length > 7 ? 'clamp(2.1rem, 8.5vw, 3.2rem)' : 'clamp(2.6rem, 11vw, 4rem)';
    digitKeys.forEach(b => { b.textContent = show(b.dataset.k); });
    $('digitBtn').textContent = myan ? '123' : '၁၂၃';
  }

  function renderHist() {
    list.textContent = '';
    if (!history.length) {
      const p = document.createElement('p');
      p.className = 'empty';
      p.textContent = 'တွက်ချက်မှု မရှိသေးပါ။ တစ်ခုခုတွက်ပြီး = နှိပ်ပါ။';
      list.append(p);
      return;
    }
    history.forEach(h => {
      const b = document.createElement('button');
      b.className = 'item'; b.type = 'button'; b.dataset.r = h.r;
      const a = document.createElement('span'); a.textContent = show(h.e) + ' =';
      const c = document.createElement('strong'); c.textContent = show(h.r);
      b.append(a, c);
      list.append(b);
    });
  }

  function openHist(open) {
    hist.hidden = !open;
    if (open) renderHist();
  }

  function setTheme(t) {
    document.documentElement.dataset.theme = t;
    $('themeBtn').textContent = t === 'dark' ? '☀' : '☾';
    store.set('calc-theme', t);
  }

  $('keys').addEventListener('click', e => {
    const b = e.target.closest('button');
    if (b) press(b.dataset.k);
  });
  $('histBtn').addEventListener('click', () => openHist(hist.hidden));
  $('closeBtn').addEventListener('click', () => openHist(false));
  $('clearBtn').addEventListener('click', () => {
    history = []; store.set('calc-history', '[]'); renderHist();
  });
  list.addEventListener('click', e => {
    const b = e.target.closest('.item');
    if (!b) return;
    cur = b.dataset.r; fresh = true; justOp = false;
    openHist(false); render();
  });
  $('digitBtn').addEventListener('click', () => {
    myan = !myan; store.set('calc-myan', myan ? '1' : '0');
    render(); if (!hist.hidden) renderHist();
  });
  $('themeBtn').addEventListener('click', () => {
    setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
  });

  document.addEventListener('keydown', e => {
    const k = e.key;
    if (/^[\d.+\-*/]$/.test(k)) press(k);
    else if (k === 'Enter' || k === '=') { e.preventDefault(); press('='); }
    else if (k === 'Backspace') press('del');
    else if (k === 'Escape') press('C');
    else if (k === '%') press('%');
  });

  setTheme(store.get('calc-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
  render();

  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }
</script>
</body>
</html>
